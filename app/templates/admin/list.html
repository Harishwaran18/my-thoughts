{% extends "base.html" %}

{% block content %}
<section class="page-head">
  <h1>Admin Dashboard</h1>
  <a href="{{ url_for('admin_new') }}" class="btn">+ New Post</a>
</section>

{% if posts %}
  <table class="admin-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Date</th>
        <th>Tags</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for post in posts %}
        <tr>
          <td><a href="{{ url_for('post', slug=post.slug) }}">{{ post.title }}</a></td>
          <td>{{ format_date(post.created_at) }}</td>
          <td>{{ post.tags }}</td>
          <td class="actions">
            <a href="{{ url_for('admin_edit', post_id=post.id) }}" class="btn btn-sm">Edit</a>
            <form action="{{ url_for('admin_delete', post_id=post.id) }}" method="post"
                  onsubmit="return confirm('Delete this post? This cannot be undone.');">
              <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <div class="empty-state">
    <p>No posts yet.</p>
    <a href="{{ url_for('admin_new') }}" class="btn">Write your first post</a>
  </div>
{% endif %}
{% endblock %}
